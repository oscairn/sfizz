# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-sampler
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.sampler
PACKAGE_NAME="Oscairn Sampler"
PACKAGE_SUMMARY="SFZ and AWM2-class sample player based on sfizz, with Oscairn sound contexts, snapshots, voice budget, instance sharing and the AWM2 element model (XA Control, Assign Switches, Key On Delay)."
# SPDX expression, as published in the packages repo (quoted: sourced by sh, and it has spaces):
LICENSE="BSD-2-Clause AND BSD-3-Clause AND MIT AND Apache-2.0 AND BSL-1.0 AND Zlib AND WTFPL AND Beerware AND CC0-1.0 AND (Unlicense OR MIT-0) AND (MIT OR Unlicense) AND LicenseRef-STK-4.3"
# Every plugin in the bundle as "descriptor-file=kind" pairs (kind: synth | effect |
# note-effect); each plugin's own version is read from its clap_plugin_descriptor_t:
PLUGINS="clap/plugin.cpp=synth"
# The package version is the plugin descriptor's version (the published release and the
# plugin version are the same number; libsfizz's own CMake version is upstream's):
PROJECT_VERSION_FILE=descriptor:clap/plugin.cpp
SOURCE_URL=https://github.com/oscairn/sfizz
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake tree to configure (the repository root; the .clap is one of sfizz's targets),
# and the .clap it produces in the build dir:
CMAKE_SOURCE_DIR=.
CLAP_FILE=library/lib/oscairn-sampler.clap
# Asset dependencies as "id@version" pairs (the published record has none):
ASSET_DEPS=
# Extra configure options, the ones .github/workflows/oscairn.yml uses (the sfizz
# options that build the static library, the plugin and the tests). The generator is
# separate so build.sh keeps its own --build flags; BUILD_TARGETS limits the build to
# the targets oscairn.yml builds (empty: the whole project):
CMAKE_GENERATOR=Ninja
CMAKE_ARGS="-DSFIZZ_TESTS=ON -DSFIZZ_CLAP=ON -DSFIZZ_RENDER=OFF -DSFIZZ_JACK=OFF -DSFIZZ_SHARED=OFF -DENABLE_LTO=OFF"
BUILD_TARGETS="sfizz_tests oscairn_sampler_clap oscairn_sampler_clap_tests oscairn_sampler_privacy_host"
# macOS-only flags: without them the binary can pick up a Homebrew library path and
# fail the dependency check on a machine that has Homebrew (the CI release runner does).
MACOS_CMAKE_ARGS="-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local"
MACOS_ENV="PKG_CONFIG_LIBDIR=/var/empty"
CLAP_VERSION_FILE=clap/third_party/clap/include/clap/version.h
OSCAIRN_CLAP_UPSTREAM=clap/third_party/oscairn-clap/upstream.json
# Asset dependencies as "id@version" pairs (the published record has none):
ASSET_DEPS=
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>;
# exactly the set the published org.oscairn.sampler record lists (25 files). The spline
# notice is a source header kept under the release folder, matching the published file.
LICENSE_FILES="external/threadpool/COPYING=ThreadPool-COPYING external/abseil-cpp/LICENSE=abseil-cpp-LICENSE external/atomic_queue/LICENSE=atomic_queue-LICENSE external/cephes/LICENSE.txt=cephes-LICENSE.txt clap/third_party/clap/LICENSE=clap-LICENSE src/external/cpuid/LICENSE.rst=cpuid-LICENSE.rst src/external/cpuid/platform/LICENSE.rst=cpuid-platform-LICENSE.rst external/st_audiofile/thirdparty/dr_libs/LICENSE=dr_libs-LICENSE src/sfizz/gen/LICENSE-STK-4.3=faust-STK-4.3.md external/filesystem/LICENSE=filesystem-LICENSE src/external/hiir/license.txt=hiir-license.txt external/invoke.hpp/LICENSE.md=invoke.hpp-LICENSE.md external/jsl/LICENSE.md=jsl-LICENSE.md src/external/kiss_fft/COPYING=kiss_fft-COPYING external/st_audiofile/thirdparty/libaiff/LICENSE=libaiff-LICENSE clap/third_party/oscairn-clap/LICENSE=oscairn-clap-LICENSE src/external/pugixml/LICENSE.md=pugixml-LICENSE.md LICENSE=sfizz-LICENSE external/simde/COPYING=simde-COPYING src/external/spline/LICENSE=spline-LICENSE scripts/oscairn/release/notices/spline-spline-notice.txt=spline-spline.cpp-notice.txt external/st_audiofile/LICENSE.md=st_audiofile-LICENSE.md external/st_audiofile/thirdparty/stb_vorbis/LICENSE=stb_vorbis-LICENSE src/external/tunings/LICENSE.md=tunings-LICENSE.md external/st_audiofile/thirdparty/wavpack/COPYING=wavpack-COPYING"
