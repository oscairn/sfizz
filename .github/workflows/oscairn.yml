# Oscairn branch (doc/oscairn-plan.md): sfizz's tests and the CLAP plugin's tests on Linux x86_64,
# Linux ARM64 and macOS, with sanitizers on Linux, and the stock-vs-fork comparison.
name: Oscairn
on:
  push:
    branches:
      - oscairn
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            compiler: gcc
            sanitizer: none
            flags: ""
            gate: true
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            compiler: gcc
            sanitizer: none
            flags: ""
            gate: true
          - name: macOS arm64
            os: macos-15
            compiler: appleclang
            sanitizer: none
            flags: ""
            gate: true
          - name: Linux x86_64 ASan UBSan
            os: ubuntu-24.04
            compiler: gcc
            sanitizer: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            gate: false
    env:
      # ccache for every cmake build in the job, the stock gate's two included
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: oscairn-sampler-${{ matrix.os }}-${{ matrix.compiler }}-Release-${{ matrix.sanitizer }}
          max-size: 1000M
          evict-old-files: job
      - name: Configure
        # Sanitized builds use Release too: at -O2 with UBSan, some of sfizz's exact float
        # comparisons in RegionValuesT fail on clang (seen on macOS, 2026-11-01)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSFIZZ_TESTS=ON -DSFIZZ_CLAP=ON -DSFIZZ_RENDER=OFF -DSFIZZ_JACK=OFF -DSFIZZ_SHARED=OFF -DENABLE_LTO=OFF \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}" -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_MODULE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --target sfizz_tests oscairn_sampler_clap oscairn_sampler_clap_tests oscairn_sampler_privacy_host
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: |
          ./build/library/bin/sfizz_tests
          ./build/library/bin/oscairn_sampler_clap_tests build/library/lib/oscairn-sampler.clap
          clap/tests/privacy-check.sh ./build/library/bin/oscairn_sampler_privacy_host build/library/lib/oscairn-sampler.clap \
            org.oscairn.sampler --library org.oscairn.privacy-test="$PWD/tests/TestFiles" --state clap/tests/privacy-state.txt
      - name: Restore the stock tree
        if: matrix.gate
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gate/stock-src
          key: sfizz-stock-src-${{ hashFiles('scripts/oscairn/compare-stock.sh') }}
      - name: Stock vs fork
        if: matrix.gate
        run: scripts/oscairn/compare-stock.sh "$RUNNER_TEMP/gate"

  # The TSan build. Its tests (25-28 minutes in one job) run in the tsan-tests jobs, split
  # two ways, on the runner image the binaries were built on.
  tsan-build:
    name: Linux x86_64 TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLAGS: "-fsanitize=thread"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: oscairn-sampler-ubuntu-24.04-gcc-Release-tsan
          max-size: 1000M
          evict-old-files: job
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSFIZZ_TESTS=ON -DSFIZZ_CLAP=ON -DSFIZZ_RENDER=OFF -DSFIZZ_JACK=OFF -DSFIZZ_SHARED=OFF -DENABLE_LTO=OFF \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$FLAGS" -DCMAKE_SHARED_LINKER_FLAGS="$FLAGS" \
            -DCMAKE_MODULE_LINKER_FLAGS="$FLAGS"
      - name: Build
        run: cmake --build build --target sfizz_tests oscairn_sampler_clap oscairn_sampler_clap_tests oscairn_sampler_privacy_host
      - uses: actions/upload-artifact@v4
        with:
          name: oscairn-sampler-tsan
          path: |
            build/library/bin/sfizz_tests
            build/library/bin/oscairn_sampler_clap_tests
            build/library/bin/oscairn_sampler_privacy_host
            build/library/lib/oscairn-sampler.clap
          retention-days: 1

  # sfizz_tests in two parts by Catch2 test spec: the element filter's rate test, which alone
  # takes about 19 of the 23 minutes under TSan, and every other test, with the CLAP tests
  # and the privacy check. --warn NoTests fails a part whose spec matches nothing.
  tsan-tests:
    name: Linux x86_64 TSan tests (${{ matrix.part }})
    needs: tsan-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1 of 2
            spec: '"*The element filter follows its 44.1 kHz response at every rate"'
          - part: 2 of 2
            spec: '~"*The element filter follows its 44.1 kHz response at every rate"'
            clap: true
    steps:
      # the test files, at the paths the tests read them from
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: oscairn-sampler-tsan
          path: build/library
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          SPEC: ${{ matrix.spec }}
        run: |
          chmod +x build/library/bin/*
          ./build/library/bin/sfizz_tests --warn NoTests --durations yes "$SPEC"
      - name: CLAP tests and privacy
        if: matrix.clap
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          ./build/library/bin/oscairn_sampler_clap_tests build/library/lib/oscairn-sampler.clap
          clap/tests/privacy-check.sh ./build/library/bin/oscairn_sampler_privacy_host build/library/lib/oscairn-sampler.clap \
            org.oscairn.sampler --library org.oscairn.privacy-test="$PWD/tests/TestFiles" --state clap/tests/privacy-state.txt
